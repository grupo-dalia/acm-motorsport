<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Hubot;src:url(hubot.woff2) format("woff2");font-weight:200 900;font-stretch:75% 125%}
@font-face{font-family:Mona;src:url(mona.woff2) format("woff2");font-weight:200 900;font-stretch:75% 125%}
html,body{margin:0;background:transparent}
.d{width:900px;height:1080px;position:relative;overflow:hidden}
.hub{font-family:Hubot}
.mona{font-family:Mona}
</style></head><body>

<!-- A · RUTA (tinta blanca + rojo, para camiseta azul medianoche) -->
<div class="d" id="ruta">
<svg width="900" height="1080" viewBox="0 0 900 1080" xmlns="http://www.w3.org/2000/svg">
  <text x="450" y="118" text-anchor="middle" class="mona" font-size="30" font-weight="600" letter-spacing="14" fill="#F5F7FA">ACM MOTORSPORT</text>
  <text x="450" y="300" text-anchor="middle" class="hub" font-size="196" font-weight="800" font-stretch="75%" letter-spacing="-4" fill="#F5F7FA">2026–2028</text>
  <text x="450" y="370" text-anchor="middle" class="mona" font-size="34" font-weight="500" letter-spacing="10" fill="#E52435">RUTA AL DESIERTO</text>
  <!-- ruta -->
  <g fill="none" stroke="#F5F7FA" stroke-width="5" stroke-linecap="round">
    <path d="M190 470 Q120 600 190 700" stroke-dasharray="2 16"/>
    <path d="M190 700 Q470 640 730 800" stroke-dasharray="2 16"/>
  </g>
  <g>
    <circle cx="190" cy="470" r="13" fill="#F5F7FA"/>
    <circle cx="190" cy="700" r="13" fill="#F5F7FA"/>
    <circle cx="730" cy="800" r="30" fill="none" stroke="#E52435" stroke-width="5"/>
    <circle cx="730" cy="800" r="14" fill="#E52435"/>
  </g>
  <g class="mona" fill="#F5F7FA">
    <text x="225" y="462" font-size="38" font-weight="700" class="hub" font-stretch="90%">ESPAÑA</text>
    <text x="225" y="496" font-size="22" font-weight="500" opacity=".65" letter-spacing="2">40.42°N 3.70°W · 2026</text>
    <text x="225" y="768" font-size="38" font-weight="700" class="hub" font-stretch="90%">MARRUECOS</text>
    <text x="225" y="802" font-size="22" font-weight="500" opacity=".65" letter-spacing="2">31.08°N 4.01°W · 2027</text>
    <text x="690" y="880" text-anchor="end" font-size="38" font-weight="700" class="hub" font-stretch="90%">ARABIA SAUDÍ</text>
    <text x="690" y="914" text-anchor="end" font-size="22" font-weight="500" opacity=".65" letter-spacing="2">22.45°N 39.10°E · 2028</text>
  </g>
  <line x1="120" y1="985" x2="780" y2="985" stroke="#F5F7FA" stroke-opacity=".3" stroke-width="2"/>
  <text x="120" y="1030" class="mona" font-size="22" font-weight="600" letter-spacing="6" fill="#F5F7FA" opacity=".8">PAJERO MK1 · 1989</text>
  <text x="780" y="1030" text-anchor="end" class="mona" font-size="22" font-weight="600" letter-spacing="6" fill="#F5F7FA" opacity=".8">Nº 21</text>
</svg>
</div>

<!-- B · PAJERO (tinta negra + rojo, para camiseta blanca/arena) -->
<div class="d" id="pajero">
<svg width="900" height="1080" viewBox="0 0 900 1080" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(94 196) scale(1.2)" fill="none" stroke="#080A0F" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- polvo -->
    <g stroke="#E52435" stroke-width="6">
      <line x1="-120" y1="190" x2="20" y2="190"/><line x1="-90" y1="218" x2="30" y2="218"/><line x1="-60" y1="246" x2="40" y2="246"/>
    </g>
    <!-- baca -->
    <path d="M85 78 H360 M110 78 V90 M200 78 V90 M290 78 V90 M350 78 V90"/>
    <!-- carrocería -->
    <path d="M58 212 V104 Q58 90 72 90 H372 L404 140 L536 146 Q550 147 550 160 V210 H512 A60 60 0 0 0 392 210 H208 A60 60 0 0 0 88 210 Z" fill="#F5F7FA"/>
    <!-- rueda de repuesto -->
    <rect x="34" y="112" width="26" height="92" rx="9" fill="#F5F7FA"/>
    <!-- ventanas -->
    <path d="M76 104 H198 V140 H76 Z"/>
    <path d="M214 104 H368 L391 140 H214 Z"/>
    <!-- puerta y línea de cintura -->
    <path d="M206 100 V206 M398 146 V206 M60 156 H545"/>
    <rect x="222" y="164" width="26" height="7" rx="3"/>
    <!-- retrovisor -->
    <path d="M384 128 h18 v14 h-14"/>
    <!-- faro y paragolpes -->
    <rect x="535" y="164" width="14" height="18" rx="2"/>
    <rect x="540" y="196" width="26" height="16" rx="3" fill="#080A0F"/>
    <rect x="28" y="196" width="22" height="16" rx="3" fill="#080A0F"/>
    <!-- aletines -->
    <path d="M80 210 A70 70 0 0 1 216 210"/>
    <path d="M384 210 A70 70 0 0 1 520 210"/>
    <!-- ruedas -->
    <g fill="#F5F7FA">
      <circle cx="148" cy="226" r="54"/><circle cx="452" cy="226" r="54"/>
    </g>
    <circle cx="148" cy="226" r="30"/><circle cx="452" cy="226" r="30"/>
    <circle cx="148" cy="226" r="8" fill="#080A0F"/><circle cx="452" cy="226" r="8" fill="#080A0F"/>
    <!-- dorsal -->
    <text x="302" y="198" text-anchor="middle" font-family="Hubot" font-size="34" font-weight="800" fill="#080A0F" stroke="none">21</text>
    <!-- suelo -->
    <path d="M-20 282 H640" stroke-width="5"/>
  </g>
  <!-- número de puerta -->
  <text x="450" y="720" text-anchor="middle" class="hub" font-size="200" font-weight="800" font-stretch="75%" letter-spacing="-4" fill="#080A0F">PAJERO MK1</text>
  <text x="450" y="790" text-anchor="middle" class="mona" font-size="34" font-weight="600" letter-spacing="12" fill="#E52435">1989 · RALLY RAID</text>
  <text x="450" y="900" text-anchor="middle" class="mona" font-size="26" font-weight="500" letter-spacing="3" fill="#080A0F" opacity=".75">Preparado, reparado y pilotado en casa.</text>
  <text x="450" y="1010" text-anchor="middle" class="mona" font-size="24" font-weight="700" letter-spacing="10" fill="#080A0F">ACM MOTORSPORT</text>
</svg>
</div>

<!-- C · ACM (blanco + franja, para sudadera/camiseta negra) -->
<div class="d" id="acm">
<svg width="900" height="1080" viewBox="0 0 900 1080" xmlns="http://www.w3.org/2000/svg">
  <text x="100" y="560" class="hub" font-size="420" font-weight="800" font-stretch="75%" letter-spacing="-14" fill="#F5F7FA">ACM</text>
  <rect x="800" y="252" width="34" height="78" fill="#E52435"/>
  <rect x="800" y="330" width="34" height="156" fill="#F1BF00"/>
  <rect x="800" y="486" width="34" height="78" fill="#E52435"/>
  <text x="108" y="640" class="mona" font-size="38" font-weight="600" letter-spacing="16" fill="#F5F7FA">MOTORSPORT</text>
  <line x1="108" y1="720" x2="834" y2="720" stroke="#F5F7FA" stroke-opacity=".35" stroke-width="2"/>
  <text x="108" y="790" class="hub" font-size="56" font-weight="700" font-stretch="90%" fill="#F5F7FA">No es solo motor.</text>
  <text x="108" y="858" class="hub" font-size="56" font-weight="700" font-stretch="90%" fill="#E52435">Es una forma de vivir.</text>
</svg>
</div>

<!-- Pecho: logo pequeño -->
<div class="d" id="pecho" style="width:300px;height:120px">

  <text x="0" y="86" class="hub" font-size="96" font-weight="800" font-stretch="75%" letter-spacing="-3" fill="currentColor">ACM</text>
  <rect x="176" y="22" width="9" height="16" fill="#E52435"/><rect x="176" y="38" width="9" height="32" fill="#F1BF00"/><rect x="176" y="70" width="9" height="16" fill="#E52435"/>
</svg>
</div>
</body></html>
